name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Линт и форматирование
        run: npm run lint
      - name: Проверка типов
        run: npm run typecheck
      - name: Unit-тесты
        run: npm run test:coverage
      - name: Валидация пилотного дела
        run: npm run case:validate
      - name: Сборка web
        run: npm run build
      - name: Проверка production-бандла
        run: npm run verify:production
      - name: Браузер Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E на двух размерах телефона
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            docs/devlog/assets/
