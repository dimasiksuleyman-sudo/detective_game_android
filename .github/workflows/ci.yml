name: Проверки и debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Нужна ли нативная сборка
        id: native
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          pr = event.get('pull_request', {})
          head = pr.get('head', {}).get('sha') or os.environ['GITHUB_SHA']
          base = event.get('before') or pr.get('base', {}).get('sha')
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(['git', 'rev-parse', head + '^'], text=True).strip()
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          needed = os.environ['CI_EVENT_NAME'] == 'workflow_dispatch' or any(
              p.startswith('android/') or p in {'package.json', 'package-lock.json', 'capacitor.config.ts'}
              for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('apk=' + str(needed).lower() + '\n')
          print('Native APK required:', needed)
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Линт и форматирование
        run: npm run lint
      - name: Проверка типов
        run: npm run typecheck
      - name: Unit-тесты
        run: npm run test:coverage
      - name: Валидация пилотного дела
        run: npm run case:validate
      - name: Сборка web
        run: npm run build
      - name: Браузер Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E на двух размерах телефона
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            docs/devlog/assets/
      - uses: actions/setup-java@v4
        if: steps.native.outputs.apk == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: steps.native.outputs.apk == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        if: steps.native.outputs.apk == 'true'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Синхронизация Capacitor
        if: steps.native.outputs.apk == 'true'
        run: npx cap sync android
      - name: Debug APK
        if: steps.native.outputs.apk == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: steps.native.outputs.apk == 'true'
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
