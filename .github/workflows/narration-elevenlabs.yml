name: Озвучка ElevenLabs (вручную)

# Платная генерация. Запускается ТОЛЬКО вручную (Actions → «Озвучка ElevenLabs» → Run workflow).
# Одна попытка на файл: уже сгенерированные файлы скрипт не трогает (ADR-025, ADR-026).
# Результат коммитится в отдельную ветку audio/elevenlabs-<caseId>, откуда открывается PR в main.

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Дело для подготовки озвучки'
        type: choice
        options: [case-001-blue-owl, case-002-room-seven]
        default: case-001-blue-owl
      mode:
        description: 'voices — список голосов и бесплатные превью; sample — одна проба на голос; all — все дорожки'
        type: choice
        options: [voices, sample, all]
        default: voices
      voices:
        description: 'Для sample: до 3 голосов через пробел, формат OWNER:VOICE (из voices.json)'
        type: string
        default: ''
      narrator:
        description: 'Для all: ID голоса рассказчика'
        type: string
        default: ''
      chief:
        description: 'Для all: ID голоса Шефа'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: narration-elevenlabs-${{ inputs.case_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ветка результатов
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git fetch origin main
          branch="audio/elevenlabs-$CASE_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch "$branch"
            git merge --no-edit origin/main
          else
            git switch -c "$branch" origin/main
          fi
          git lfs pull --include="art/narration/elevenlabs/$CASE_ID/**"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Генерация
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CASE_ID: ${{ inputs.case_id }}
          MODE: ${{ inputs.mode }}
          VOICES: ${{ inputs.voices }}
          NARRATOR: ${{ inputs.narrator }}
          CHIEF: ${{ inputs.chief }}
        run: |
          case "$MODE" in
            voices) python3 tools/generate-narration-elevenlabs.py --case "$CASE_ID" --voices ;;
            sample)
              args=()
              for v in $VOICES; do args+=(--voice "$v"); done
              python3 tools/generate-narration-elevenlabs.py --case "$CASE_ID" --sample --allow-paid "${args[@]}" ;;
            all) python3 tools/generate-narration-elevenlabs.py --case "$CASE_ID" --all --allow-paid --narrator "$NARRATOR" --chief "$CHIEF" ;;
          esac
      - name: Коммит результатов
        env:
          CASE_ID: ${{ inputs.case_id }}
          MODE: ${{ inputs.mode }}
        run: |
          git add art/narration docs/devlog/assets/narration-elevenlabs public/cases/*/audio 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Нет новых файлов"
          else
            git commit -m "ElevenLabs narration: $MODE"
            git push origin "audio/elevenlabs-$CASE_ID"
          fi
